openapi: 3.0.3
info:
  title: Slack Archiver REST API
  version: 1.0.0
  contact:
    name: Slack Archiver
    url: https://github.com/offcentric/slack-archiver
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC
  description: |
    HTTP contract for the Slack Archiver Express API (`api/`). This spec is the source of
    truth for request/response shapes when building a client. Pair it with `AGENTS.md`
    for architecture, data model, ingest, and how to add API features.

    **Product.** A long-term archive of Slack public and private channels (never DMs).
    One API instance can serve multiple Slack workspaces. App users may only read
    workspaces listed on their account.

    **Not in this API.** There is no workspace catalog (use `workspaces` from login)
    and no user-admin CRUD. Archived bytes are available at `GET /file/content/{id}`
    (session required, path confined to the download directory). Slack `url_private`
    is still not a public URL. `POST /message/channels` lists every archived channel
    in a workspace. `POST /user/getchannels` remains the channels that person has
    posted in. Admin import is `POST /admin/sync` and `POST /admin/channels` (role 100).
    `POST /admin/thumbnails` backfills JPG stills for archived videos. New videos are
    also thumbnailed from the Slack webhook. Stills are served at `GET /file/thumbnail/{id}`.

    ---

    ## Client implementation guide

    Prefer **POST** with `Content-Type: application/json`. `GET` exists only for
    `/health`, `/message/list`, `/message/listthreaded`, and `/file/list`. Pagination (`_limit`, `_page`,
    `_orderby`) is read from the **JSON body only**, so GET list calls cannot paginate
    unless they also send a body (non-standard). Use POST for all list/get/search calls.

    Extra JSON keys are ignored. Only fields registered in `api/src/payload/` are parsed.

    ### Auth flow

    1. `POST /user/sendlogincode` with `{ "email" }`. Always treat HTTP 200 as success.
       Unknown emails still return success (no account enumeration). If the email exists,
       Mailgun sends a 6-digit code, cached 5 minutes in-process (`node-cache`). Codes
       are lost on API restart and are not shared across processes.
    2. `POST /user/login` with `{ "email", "code" }`. Persist the entire response:
       `session_id`, `id`, `email`, `role`, `workspaces`.
       `workspaces` is one object per name in `user.workspaces`, enriched from
       `slackuser` where `user_id` equals this app user
       (`{ workspace, uid, name, real_name, … }`). `uid` is that person's Slack id
       in that workspace (null until the row is linked). Use it when filtering messages with `user`.
    3. `POST /user/getuserdata` (Bearer token, no body) returns the same profile nested
       as `{ "userData": { ... } }` (no `session_id`).
    4. `POST /user/getchannels` with `{ "workspace" }` returns the channel **names**
       that person has posted in (`message.user` = session `uid` for that workspace).
    5. On every authenticated request send
       `Authorization: Bearer <session_id>`. Do not put `session_id` in the JSON body.
    6. `POST /user/logout` (Bearer token, no body) to destroy the session.

    Do **not** rely on cookies. A `user_session` cookie may be set but session lookup
    only reads the Bearer token.

    ### Workspace ACL

    `workspaces` on the login response is the ACL: one object per name in
    `user.workspaces`, enriched from a `slackuser` row with `user_id = user.id` in
    that workspace when one exists (`workspace`, `uid`, `name`, `real_name`, plus
    `id` / `team_id` / `is_bot`). List handlers compare the request `workspace` string
    against `workspaces[].workspace`. The Slack `uid` is stored on the session at login
    so a client can filter messages for that person (`user: workspaces[i].uid`) in the
    selected workspace.

    List handlers rewrite `workspace` as follows:

    - Omitted → filter to all of `session.workspaces[].workspace`.
    - Provided → must match a `workspaces[].workspace`, else `403` `no_access_to_workspace`.
      Internally it becomes a one-element array.

    **Caveat (file list and slackuser list):** `workspace` is not in those payload
    schemas, so a client-supplied `workspace` is dropped before the ACL helper runs.
    Those lists always return every workspace the session may see. Message list *does*
    honor `workspace`.

    ### Channel names

    `channel` is the Slack **channel name** (e.g. `general`), never the Slack channel ID
    (`C0…`). Use `POST /user/getchannels` with a `workspace` to list channels the
    logged-in user has posted in. That is not a full Slack membership list — channels
    they never wrote in will be absent.

    ### Threads

    `POST /message/list` is **flat**. Thread replies have `reply_to` set to the parent
    message `ts`. `POST /message/listthreaded` returns only top-level messages
    (`reply_to` is null) in `items`, each with a `replies` array of child messages
    in chronological `ts` order. `_orderby` on `listthreaded` sorts **parents only**.
    `POST /message/get` also returns a `replies` array on the parent.

    Nested `slackuser`, `files`, `attachments`, and `blocks` on messages are produced
    with `json_agg`, so **`slackuser` is an array** (usually 0–1 objects), not a single
    object.

    ### Pagination

    Body fields (not query string):

    | Field | Meaning |
    | --- | --- |
    | `_limit` | Page size. Defaults to **500** for message and file lists if omitted. |
    | `_page` | 1-based page. **Ignored unless `_limit` is also set.** Offset is `(_page - 1) * _limit`. |
    | `_orderby` | Column name string (ASC) or `[column, direction]` e.g. `["ts", "desc"]`. |

    Paginated responses:

    ```json
    { "items": [], "totalitems": 0, "totalpages": 0, "page": 1 }
    ```

    Compute page count in the client as `Math.ceil(totalitems / limit)`. Do not trust
    `totalpages` on a short last page (the server divides by `items.length`).

    Slackuser list returns `{ "items": [] }` only — no totals.

    ### Dates

    `date_from` / `date_to` are strings parsed with `new Date(...)`. Send ISO dates
    (`2026-01-15` or `2026-01-15T00:00:00.000Z`). The server treats both as calendar
    days on `message.datetime` or `file.created_at`: `date_from` is `>=` the start of
    that day and `date_to` is `<` the start of the following day, so a range of
    `2026-01-15` to `2026-01-15` returns everything posted on that day.

    Invalid dates → `400` `invalid_date_from` / `invalid_date_to`.

    Empty string `channel` on message list is treated as “no channel filter”.

    ### Success vs error envelopes

    Success is usually the **payload itself** (user row, message object, collection),
    HTTP 200. A few auth endpoints return `{ "status", "success", "error" }`.

    Controlled errors (typical):

    ```json
    {
      "status": "error",
      "success": false,
      "error": true,
      "message": "auth_fail",
      "detail": null,
      "stack": {}
    }
    ```

    `stack` is omitted outside development. Middleware and the catch-all 404 use a
    shorter shape (`error` + `code` [+ `message`]).

    ### CORS

    Allowed browser origins match `mark.local:<4-digit-port>`, `localhost:<4-digit-port>`,
    and `*.slack.com`.

    ### Rate limit and IP blacklist

    Both are **off by default** (`ENABLE_RATE_LIMIT`, `ENABLE_IP_BLACKLIST`). When on:
    5 requests / 5s per UA+IP+path+body fingerprint → `429` `rate_limited`; listed IPs
    → `403` `ip_blacklisted`.

    ---

    ## Known gaps (documenting behaviour, not endorsing it)

    | Gap | Impact on a client |
    | --- | --- |
    | `POST /slackuser/get` has no payload schema | Always fails with `missing_filter`. Use `POST /slackuser/list`. |
    | Slack user list ignores `workspace` | Filter `items[].workspace` in the client. Message and file list do honor `workspace`. |
    | Login codes are in-process cache | Restart invalidates unused codes. |
    | `GET /file/content/{id}` needs the file on disk | Rows without a `savepath` inside `FILES_DOWNLOAD_DIRECTORY` return `404` `file_not_on_disk`. |

    `/webhook` is Slack Events API ingest. It is documented here for completeness;
    a user-facing frontend must not call it.

tags:
  - name: Health
    description: Unauthenticated liveness. Use this for uptime checks (not logged via `res.send`).
  - name: Auth
    description: Email + 6-digit login code. No passwords.
  - name: Messages
    description: Archived Slack messages (the primary browse/search surface).
  - name: Files
    description: Archived Slack file metadata. No binary download.
  - name: Slack users
    description: People in Slack (`slackuser`), not app accounts.
  - name: Admin
    description: Admin-only Slack import. Role `100` only. Never imports direct messages.
  - name: Ingest
    description: Slack Events API webhook. Not for the user-facing client.

servers:
  - url: http://localhost:6969
    description: Local development. `PORT` in `api/.env` (template default 6969).
  - url: https://{host}
    description: Deployed API
    variables:
      host:
        default: example.example
        description: Public hostname of the API

security: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness
      description: Unauthenticated. Returns JSON `{"status":"ok"}`.
      security: []
      responses:
        '200':
          description: API process is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '403':
          $ref: '#/components/responses/IpBlacklisted'
        '429':
          $ref: '#/components/responses/RateLimited'

  /user/sendlogincode:
    post:
      tags: [Auth]
      operationId: sendLoginCode
      summary: Email a 6-digit login code
      description: |
        If `email` belongs to an app user, Mailgun sends a 6-digit code valid for
        5 minutes. If the email is unknown, the handler still returns the success
        envelope so clients cannot enumerate accounts.

        Email is lowercased. Must look like an email or the API returns
        `invalid_data_for_fields : {email}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendLoginCodeRequest'
            example:
              email: archive-reader@example.com
      responses:
        '200':
          description: Code sent, or email unknown (same envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                status: ok
                success: true
                error: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Mail send failed (`failed_to_send_code`) or unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /user/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange email + code for a session
      description: |
        `code` must be an integer 100000–999999 matching the cached value for that
        email. On success the cache entry is cleared.

        Failures `user_not_found` and `invalid_code` are collapsed to `401` `auth_fail`
        (no enumeration). Repeated failures from the same IP are written to `user_login`;
        after `MAX_LOGIN_FAILS` (default 5) the IP may be inserted into `ip_blacklist`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: archive-reader@example.com
              code: 123456
      responses:
        '200':
          description: App user row plus `session_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                id: 1
                email: archive-reader@example.com
                role: 1
                workspaces:
                  - workspace: acme
                    uid: U012ABCDEF
                    name: archive.reader
                    real_name: Archive Reader
                  - workspace: widgets
                    uid: U098ZYXWVU
                    name: archive.reader
                    real_name: Archive Reader
                session_id: QkYk2m8s0a1b2c3d4e5f6g7h
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email/code (`auth_fail`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: error
                success: false
                error: true
                message: auth_fail
                detail: null
                stack: {}
        '500':
          $ref: '#/components/responses/ServerError'

  /user/getuserdata:
    post:
      tags: [Auth]
      operationId: getUserData
      summary: Reload the current user profile
      description: |
        Authenticated. Loads the app user by session email and returns the same
        enriched profile as login: `user.workspaces` as identity objects (Slack
        `name` / `real_name` live on those objects, not on the app user), nested
        under `userData`. Does not rotate `session_id`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserDataResponse'
              example:
                userData:
                  id: 1
                  email: archive-reader@example.com
                  role: 1
                  workspaces:
                    - workspace: acme
                      uid: U012ABCDEF
                      name: archive.reader
                      real_name: Archive Reader
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /user/getchannels:
    post:
      tags: [Auth]
      operationId: getChannels
      summary: List channels the user has posted in
      description: |
        Authenticated. `workspace` is required and must be in `session.workspaces`.

        Resolves the logged-in person's Slack `uid` for that workspace from the
        session identities (`slackuser.user_id = session user id`). If the session is
        missing a uid, the handler reloads linked `slackuser` rows by `user_id`. Then:

        `SELECT channel FROM message WHERE workspace = ? AND user = ? GROUP BY channel`

        Returns distinct channel **names**, sorted A–Z. Empty `items` if the user has
        no Slack uid in that workspace or has never posted there. Does not list
        channels they can only read.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetChannelsRequest'
            example:
              workspace: acme
      responses:
        '200':
          description: Distinct channel names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChannelsResponse'
              example:
                items: [alerts, general, random]
        '400':
          description: Missing `workspace`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWorkspace'
        '500':
          $ref: '#/components/responses/ServerError'

  /user/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Destroy the current session
      description: |
        Requires a valid session. If there is no session, the handler still returns
        the logged-out envelope (idempotent).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session destroyed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                status: logged_out
                success: true
                error: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /message/list:
    post:
      tags: [Messages]
      operationId: listMessages
      summary: List archived messages
      description: |
        Authenticated. Workspace ACL applied. Default order `ts DESC`. Default page
        size 500.

        Returns a **flat** list (channel messages and thread replies together).
        Replies have `reply_to` set to the parent `ts`, plus a `parent` object
        `{ ts, text, channel, user }` when that parent is in an allowed workspace.
        `parent` is null for top-level messages.

        List items include joined children (`slackuser`, `files`, `attachments`,
        `blocks`) when present. `team` and `type` are omitted from list rows
        (`show_in_list: false`); use `POST /message/get` for those fields.

        `replies[]` is **not** populated on list items. `text` filters with a
        case-insensitive substring. `_orderby` is limited to `datetime`, `ts`,
        `user`, `channel`, `text`, and `id`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageListRequest'
            examples:
              latestInChannel:
                summary: Latest messages in one allowed workspace/channel
                value:
                  workspace: acme
                  channel: general
                  _limit: 50
                  _page: 1
                  _orderby: [ts, desc]
              dateRange:
                summary: All allowed workspaces, date range
                value:
                  date_from: '2026-01-01'
                  date_to: '2026-01-31'
                  user: U012ABCDEF
                  _limit: 100
                  _page: 1
      responses:
        '200':
          description: Paginated message collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWorkspace'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Messages]
      operationId: listMessagesGet
      summary: List archived messages (GET)
      description: |
        Same handler as POST. Filter fields may be query parameters. Auth is the
        `Authorization: Bearer` header (not a query param).

        `_limit` / `_page` / `_orderby` are **not** read from the query string.
        Prefer POST.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceQuery'
        - $ref: '#/components/parameters/ChannelQuery'
        - $ref: '#/components/parameters/UserQuery'
        - $ref: '#/components/parameters/DateFromQuery'
        - $ref: '#/components/parameters/DateToQuery'
      responses:
        '200':
          description: Paginated message collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWorkspace'
        '500':
          $ref: '#/components/responses/ServerError'

  /message/listthreaded:
    post:
      tags: [Messages]
      operationId: listMessagesThreaded
      summary: List top-level messages with nested replies
      description: |
        Authenticated. Workspace ACL applied. Same filters and pagination as
        `POST /message/list` (`workspace`, `channel`, `user`, `date_from`, `date_to`,
        `_limit`, `_page`, `_orderby`). Default order `ts DESC`. Default page size 500.

        `items` contains **only** top-level messages (`reply_to` is null). Pagination
        (`totalitems`, `totalpages`, `page`) counts those parents only.

        Each item includes `replies`: every message whose `reply_to` equals that
        parent's `ts`, always ordered by `ts` ascending (chronological). `_orderby`
        does **not** affect `replies`.

        Filters (`user`, `date_from` / `date_to`, `channel`, `workspace`) apply to
        parents. Once a parent is included, **all** of its replies are returned
        (same nested joins as list: `slackuser`, `files`, `attachments`, `blocks`).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageListRequest'
            examples:
              latestInChannel:
                summary: Latest threads in one allowed workspace/channel
                value:
                  workspace: acme
                  channel: general
                  _limit: 50
                  _page: 1
                  _orderby: [ts, desc]
      responses:
        '200':
          description: Paginated top-level messages, each with chronological replies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageThreadedListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWorkspace'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Messages]
      operationId: listMessagesThreadedGet
      summary: List top-level messages with nested replies (GET)
      description: |
        Same handler as POST. Filter fields may be query parameters. Auth is the
        `Authorization: Bearer` header (not a query param).

        `_limit` / `_page` / `_orderby` are **not** read from the query string.
        Prefer POST.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceQuery'
        - $ref: '#/components/parameters/ChannelQuery'
        - $ref: '#/components/parameters/UserQuery'
        - $ref: '#/components/parameters/DateFromQuery'
        - $ref: '#/components/parameters/DateToQuery'
      responses:
        '200':
          description: Paginated top-level messages, each with chronological replies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageThreadedListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWorkspace'
        '500':
          $ref: '#/components/responses/ServerError'

  /message/get:
    post:
      tags: [Messages]
      operationId: getMessage
      summary: Get one message by id or ts
      description: |
        Authenticated. Provide `id` (integer PK) **or** `ts` (Slack timestamp string).
        Both may be sent; they are AND-ed.

        Always loads thread `replies` (messages whose `reply_to` equals this `ts`),
        each with the usual list joins. Nested `replies` on those children are typically
        empty arrays.

        Body flag `simple` is accepted (`true` / `1` / `"true"`) but currently does
        **not** strip nested relations or replies.

        Missing row → `404` `message_not_found`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageGetRequest'
            examples:
              byTs:
                value:
                  ts: '1704067200.123456'
              byId:
                value:
                  id: 446545
      responses:
        '200':
          description: Single message with nested children and replies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '400':
          description: 'Missing both id and ts (`missing_required_fields : {id,ts}`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No row (`message_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /message/search:
    post:
      tags: [Messages]
      operationId: searchMessages
      summary: Full-text search on message.text
      description: |
        PostgreSQL FTS (`english` config, `plainto_tsquery`) on **`message.text` only**.
        Results are a **raw array** of message rows plus a numeric `rank` — not the
        paginated `{ items }` envelope, and **no joined children**. Rows are ordered
        by `datetime` descending (newest first), then `ts` descending. `rank` is
        still included and is not the sort key.

        Default `limit` 20, `page` 1 (offset `(page - 1) * limit`).

        Requires a session. Results are limited to `session.workspaces[].workspace`.
        A `workspace` value must be one of those names (`403` `no_access_to_workspace`
        otherwise). Optional `channel` and `user` (Slack user id) are equality filters.
        An account with no workspaces receives an empty array.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSearchRequest'
            example:
              q: deploy pipeline
              limit: 20
              page: 1
      responses:
        '200':
          description: Message rows newest first (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageSearchHit'
        '400':
          description: Missing `q`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWorkspace'
        '500':
          description: '`search_query_failed` or no searchable fields'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /file/list:
    post:
      tags: [Files]
      operationId: listFiles
      summary: List archived file metadata
      description: |
        Authenticated. Default order `created_at DESC`. Default page size 500.

        Filtered to `session.workspaces[].workspace`. A client-supplied `workspace` must be
        one of those names. `channel` is ignored unless `media` is true, in which case
        files are limited to images and videos attached to messages in that channel.
        Bytes are served from `GET /file/content/{id}`, not from Slack `url_private`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileListRequest'
            example:
              user: U012ABCDEF
              date_from: '2026-01-01'
              date_to: '2026-01-31'
              _limit: 50
              _page: 1
      responses:
        '200':
          description: Paginated file collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Files]
      operationId: listFilesGet
      summary: List archived file metadata (GET)
      description: Same handler as POST. Auth via `Authorization` header. Prefer POST.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserQuery'
        - $ref: '#/components/parameters/DateFromQuery'
        - $ref: '#/components/parameters/DateToQuery'
      responses:
        '200':
          description: Paginated file collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /file/get:
    post:
      tags: [Files]
      operationId: getFile
      summary: Get one file by numeric id
      description: |
        Authenticated. Lookup is the integer primary key `id`, **not** Slack `uid`.
        Includes `mimetype` (hidden on list). Missing row → `404` `file_not_found`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileGetRequest'
            example:
              id: 14622
      responses:
        '200':
          description: File metadata row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: Missing `id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`file_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /file/content/{id}:
    get:
      tags: [Files]
      operationId: getFileContent
      summary: Stream an archived image or other file
      description: |
        Authenticated via `Authorization: Bearer`. `id` is the numeric file primary key.
        The file's `workspace` must be on the session. The local `savepath` must resolve
        inside `FILES_DOWNLOAD_DIRECTORY`. The response body is the file bytes
        (`Content-Type` from `mimetype`), not JSON.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWorkspace'
        '404':
          description: '`file_not_found` or `file_not_on_disk`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /file/thumbnail/{id}:
    get:
      tags: [Files]
      operationId: getFileThumbnail
      summary: Stream a generated JPEG still for an archived video
      description: |
        Authenticated via `Authorization: Bearer`. `id` is the numeric file primary key.
        The file's `workspace` must be on the session. The still is `static/thumbnails/{id}.jpg`,
        created by `POST /admin/thumbnails` or by the Slack webhook when a message includes a video.
        The response body is `image/jpeg`, not JSON.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: JPEG thumbnail
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWorkspace'
        '404':
          description: '`thumbnail_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /message/channels:
    post:
      tags: [Messages]
      operationId: listMessageChannels
      summary: Distinct archived channel names for a workspace
      description: |
        Authenticated. Returns `{ "items": ["general", "random"] }` sorted by channel
        name. This is every channel that has archived messages in the workspace, not
        only channels the current user has posted in. `403` if `workspace` is outside
        the session ACL.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace:
                  type: string
      responses:
        '200':
          description: Channel names
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWorkspace'

  /admin/sync:
    post:
      tags: [Admin]
      operationId: syncArchive
      summary: Import Slack users or channel history
      description: |
        Admin role only (`role` 100). `action` is `users` or `messages`.
        `messages` requires `channel` and may include `limit`, `latest`, and `oldest`
        (Slack timestamps as strings). The call blocks until the Slack import finishes.
        Direct messages are not requested. User ids in
        `SLACK_IGNORED_USERS_<WORKSPACE>` are omitted from a `users` import, and
        their messages are omitted from a `messages` import. `403` `admin_only` for other roles, or
        `no_access_to_workspace` when the workspace is outside the session ACL.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, workspace]
              properties:
                action:
                  type: string
                  enum: [users, messages]
                workspace:
                  type: string
                channel:
                  type: string
                limit:
                  type: integer
                latest:
                  type: string
                oldest:
                  type: string
      responses:
        '200':
          description: Import finished
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: string
                  channel:
                    type: string
                  imported:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`admin_only` or `no_access_to_workspace`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /admin/channels:
    post:
      tags: [Admin]
      operationId: listSlackChannels
      summary: Public and private Slack channels available to sync
      description: |
        Admin role only. Asks Slack for `public_channel` and `private_channel` names.
        IM and MPIM conversations are excluded.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace:
                  type: string
      responses:
        '200':
          description: Channel names
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`admin_only` or `no_access_to_workspace`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /admin/thumbnails:
    post:
      tags: [Admin]
      operationId: backfillVideoThumbnails
      summary: Generate missing JPEG stills for archived videos
      description: |
        Admin role only (`role` 100). Walks video files in `workspace` and writes
        `static/thumbnails/{id}.jpg` for each one that does not already have a still.
        Requires `ffmpeg` on the API host. The call blocks until the batch finishes.
        `403` `admin_only` for other roles, or `no_access_to_workspace` when the
        workspace is outside the session ACL. `500` `ffmpeg_not_available` when
        ffmpeg is not installed.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace:
                  type: string
      responses:
        '200':
          description: Batch finished
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: string
                  total:
                    type: integer
                  generated:
                    type: integer
                  skipped:
                    type: integer
                  failed:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`admin_only` or `no_access_to_workspace`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: '`ffmpeg_not_available`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /slackuser/list:
    post:
      tags: [Slack users]
      operationId: listSlackusers
      summary: List Slack people visible to the session
      description: |
        Authenticated. Default order `name` ASC. No pagination metadata — the response
        is `{ "items": [ ... ] }` only. Model default limit is 500.

        Client-supplied `workspace` is **ignored** (no payload schema for this path).
        Results are limited to `session.workspaces[].workspace`.

        These are Slack members (`uid`, `name`, `real_name`, `is_bot`), not app logins.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Slackuser collection without totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackuserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /slackuser/get:
    post:
      tags: [Slack users]
      operationId: getSlackuser
      summary: Get one Slack user (currently unusable)
      deprecated: true
      description: |
        Route is mounted and calls `checkAuth`, but **no payload schema is registered**
        for `slackuser`. `getPayload()` is always `{}`, then `_get` throws `missing_filter`.

        **Do not call this from a client.** Use `POST /slackuser/list` and find the row
        by `uid` or `id`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: |
            Not reachable in the current implementation. Documented for when a
            payload schema is added; until then the handler throws `missing_filter`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slackuser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Always `missing_filter` when a session is present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /webhook:
    post:
      tags: [Ingest]
      operationId: slackWebhook
      summary: Slack Events API ingest
      description: |
        Unauthenticated in the app-user sense. Auth is Slack `body.token` vs
        `SLACK_VERIFICATION_TOKEN_<WORKSPACE>` (workspace from query, uppercased in
        the env key).

        Query `workspace` is the lowercase workspace name (required except URL
        verification). If `body.challenge` is present, the response body is that
        challenge string (Slack URL verification).

        Handled `event.type` values: `message` (including edits/deletes), `team_join`,
        `channel_created`, `channel_rename`, `channel_archive`, `channel_unarchive`,
        `channel_deleted`, `group_rename`, `group_archive`, `group_unarchive`,
        `group_deleted`. Other types → `invalid_event_type: …`.

        Channels listed in `SLACK_IGNORED_CHANNELS_<WORKSPACE>` are skipped.
        User ids listed in `SLACK_IGNORED_USERS_<WORKSPACE>` are skipped, including
        `team_join` and their messages.
        Persist errors may be posted to `SLACK_ALERTS_CHANNEL_<WORKSPACE>` (default
        `alerts`).

        **Frontend clients must not call this endpoint.**
      security: []
      parameters:
        - name: workspace
          in: query
          required: false
          description: Lowercase workspace name. Required for event payloads; not required for `challenge`.
          schema:
            type: string
            example: acme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackEventEnvelope'
            examples:
              urlVerification:
                summary: Slack URL verification
                value:
                  token: slack-verification-token
                  challenge: abcdef
                  type: url_verification
              message:
                summary: Message event (shape abbreviated)
                value:
                  token: slack-verification-token
                  type: event_callback
                  event:
                    type: message
                    user: U012ABCDEF
                    ts: '1704067200.123456'
                    text: hello
                    channel: C01234567
                    team: T01234567
      responses:
        '200':
          description: Challenge string, or ingest result object
          content:
            application/json:
              schema:
                description: Challenge is a JSON string; event handling returns the save/upsert result.
                oneOf:
                  - type: string
                    example: abcdef
                  - $ref: '#/components/schemas/AddEditResult'
                  - type: object
                    additionalProperties: true
        '400':
          description: |
            `missing_workspace`, `missing_event_data`, `missing_token`, `token_mismatch`,
            `missing_channel`, `invalid_event_type: …`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Session
      description: |
        Session id returned by `POST /user/login`. Send on every authenticated
        request as `Authorization: Bearer <session_id>`. Do not put `session_id`
        in the JSON body.

  parameters:
    WorkspaceQuery:
      name: workspace
      in: query
      schema:
        type: string
      description: Lowercase workspace name. Must match a `session.workspaces[].workspace`.
    ChannelQuery:
      name: channel
      in: query
      schema:
        type: string
      description: Channel **name**, not Slack ID.
    UserQuery:
      name: user
      in: query
      schema:
        type: string
      description: Slack user id (`U…`) of the message author or file uploader.
    DateFromQuery:
      name: date_from
      in: query
      schema:
        type: string
        format: date
    DateToQuery:
      name: date_to
      in: query
      schema:
        type: string
        format: date

  responses:
    BadRequest:
      description: |
        Validation failure. Typical `message` values:
        `missing_required_fields : {a,b}`, `invalid_data_for_fields : {…}`,
        `invalid_date_from`, `invalid_date_to`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing/invalid session (`no_session`, `auth_fail`, or muted 401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: error
            success: false
            error: true
            message: no_session
            detail: null
            stack: {}
    ForbiddenWorkspace:
      description: Requested `workspace` is not in `session.workspaces[].workspace`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: error
            success: false
            error: true
            message: no_access_to_workspace
            detail: null
            stack: {}
    ServerError:
      description: Unhandled exception or generic `status.error` (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded (only if `ENABLE_RATE_LIMIT` is on).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiddlewareError'
          example:
            error: true
            code: 429
            message: rate_limited
    IpBlacklisted:
      description: Client IP is blacklisted (only if `ENABLE_IP_BLACKLIST` is on).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiddlewareError'
          example:
            error: true
            code: 403
            message: ip_blacklisted
    NotFoundCatchAll:
      description: Unknown path. Shape differs from `ErrorEnvelope`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
          example:
            error: true
            code: 404

  schemas:
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    SuccessEnvelope:
      type: object
      required: [status, success, error]
      properties:
        status:
          type: string
          example: ok
        success:
          type: boolean
          enum: [true]
        error:
          type: boolean
          enum: [false]

    LogoutResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            status:
              type: string
              enum: [logged_out]

    ErrorEnvelope:
      type: object
      required: [status, success, error, message]
      properties:
        status:
          type: string
          enum: [error]
        success:
          type: boolean
          enum: [false]
        error:
          type: boolean
          enum: [true]
        message:
          type: string
          description: |
            Machine-readable string. Common values: `auth_fail`, `no_session`,
            `no_access_to_workspace`, `missing_required_fields : {…}`,
            `invalid_data_for_fields : {…}`, `invalid_date_from`, `invalid_date_to`,
            `failed_to_send_code`, `{table}_not_found`, `missing_filter`,
            `search_query_failed`.
        detail:
          type: string
          nullable: true
          description: Extra context; often `null` or a JSON string.
        stack:
          description: Present in development only.
          nullable: true
          type: object
          additionalProperties: true

    MiddlewareError:
      type: object
      required: [error, code]
      properties:
        error:
          type: boolean
          enum: [true]
        code:
          type: integer
          enum: [403, 429]
        message:
          type: string
          enum: [ip_blacklisted, rate_limited]

    NotFoundError:
      type: object
      required: [error, code]
      properties:
        error:
          type: boolean
          enum: [true]
        code:
          type: integer
          enum: [404]

    SendLoginCodeRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Lowercased before lookup.

    LoginRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: integer
          minimum: 100000
          maximum: 999999
          description: 6-digit code from email. JSON number or numeric string.

    UserRole:
      type: integer
      description: |
        App role. `0` default in DB; `1` user; `10` superuser; `100` admin
        (`helpers/user.ts` `UserRoles`).
      enum: [0, 1, 10, 100]

    UserWorkspace:
      type: object
      required: [workspace]
      description: |
        One allowed workspace from `user.workspaces`. When a `slackuser` row is linked
        (`slackuser.user_id = user.id` for this workspace), identity fields are filled
        in. `user_id` itself is not included.
      properties:
        id:
          type: integer
          description: '`slackuser.id` primary key.'
        workspace:
          type: string
          description: Lowercase workspace name. This is the ACL key and the `workspace` filter on list endpoints.
          example: acme
        uid:
          type: string
          nullable: true
          description: |
            Slack user id (`slackuser.uid`) for the logged-in person in this workspace.
            Persist this and send it as `user` when listing that person's messages.
          example: U012ABCDEF
        team_id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
          description: Slack username / handle (`slackuser.name`).
        real_name:
          type: string
          nullable: true
          description: Slack display name (`slackuser.real_name`).
        is_bot:
          type: boolean
          nullable: true

    UserProfile:
      type: object
      required: [id, email, role, workspaces]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/UserWorkspace'
          description: |
            One item per name in `user.workspaces`, enriched from linked `slackuser`
            rows (`user_id = user.id`). Stored on the session at login. ACL uses
            `workspace`; message-author filters use `uid`.

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          required: [session_id]
          properties:
            session_id:
              type: string
              description: 'Persist this and send `Authorization: Bearer <session_id>` on subsequent authenticated calls.'

    GetUserDataResponse:
      type: object
      required: [userData]
      properties:
        userData:
          $ref: '#/components/schemas/UserProfile'

    GetChannelsRequest:
      type: object
      required: [workspace]
      properties:
        workspace:
          type: string
          description: Lowercase workspace name. Must match a `session.workspaces[].workspace`.

    GetChannelsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
          description: Channel names (`message.channel`), sorted ascending.

    PaginationFields:
      type: object
      properties:
        _limit:
          type: integer
          minimum: 1
          description: Page size. Message/file list default 500 if omitted.
        _page:
          type: integer
          minimum: 1
          description: 1-based. Ignored unless `_limit` is also set.
        _orderby:
          description: Column name (ASC) or `[column, direction]`.
          oneOf:
            - type: string
              example: ts
            - type: array
              minItems: 2
              maxItems: 2
              items:
                type: string
              example: [ts, desc]

    MessageListRequest:
      allOf:
        - $ref: '#/components/schemas/PaginationFields'
        - type: object
          properties:
            workspace:
              type: string
              description: Lowercase workspace name. Must be in session ACL. Omit to query all allowed workspaces.
            channel:
              type: string
              description: Channel name. Empty string is treated as omitted.
            user:
              description: Slack user id, or an array of ids (`IN`).
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
            text:
              type: string
              description: Case-insensitive substring match on `message.text`. Applied on submit, not per keypress, by the client.
            date_from:
              type: string
              description: Inclusive lower bound on `datetime` (date-only after parse).
            date_to:
              type: string
              description: Inclusive upper bound on `datetime` (date-only after parse).

    FileListRequest:
      allOf:
        - $ref: '#/components/schemas/PaginationFields'
        - type: object
          properties:
            user:
              type: string
              description: Slack user id of the uploader (`file.user`).
            date_from:
              type: string
              description: Inclusive lower bound on `created_at`.
            date_to:
              type: string
              description: Inclusive upper bound on `created_at`.
            workspace:
              type: string
              description: Lowercase workspace name. Must be in the session ACL. Omit to query every allowed workspace.
            channel:
              type: string
              description: Used when `media` is true. Limits files to those attached to messages in this channel.
            media:
              type: boolean
              description: When true, return images and videos only, with uploader `real_name` when linked.

    MessageGetRequest:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              description: Database primary key.
            ts:
              description: Slack message timestamp (unique). Stored as varchar; send the string form.
              oneOf:
                - type: string
                  example: '1704067200.123456'
                - type: number
            simple:
              description: Accepted; does not currently omit nested data.
              oneOf:
                - type: boolean
                - type: integer
                  enum: [0, 1]
                - type: string
                  enum: ['true', 'false']
          anyOf:
            - required: [id]
            - required: [ts]

    FileGetRequest:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              description: '`file.id` primary key, not Slack file `uid`.'

    MessageSearchRequest:
      allOf:
        - type: object
          required: [q]
          properties:
            q:
              type: string
              description: Full-text query (`plainto_tsquery`). Required.
            limit:
              type: integer
              default: 20
              description: SQL LIMIT. Defaults to 20 (not 500).
            page:
              type: integer
              default: 1
              minimum: 1
            workspace:
              type: string
              description: Must be one of the session workspaces. Omit to search all of them.
            channel:
              type: string
              description: Limit results to this archived channel name.
            user:
              type: string
              description: Limit results to this Slack user id (`message.user`).

    PaginatedCollection:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {}
        totalitems:
          type: integer
          description: Total matching rows (count query).
        totalpages:
          type: integer
          description: |
            Server value is `ceil(totalitems / items.length)` for the current page.
            Prefer `ceil(totalitems / _limit)` in the client.
        page:
          type: integer
          description: 1 if `_page` was omitted.

    Slackuser:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
          description: Slack user id (`U…` or bot id).
          example: U012ABCDEF
        workspace:
          type: string
        team_id:
          type: string
          nullable: true
        name:
          type: string
          description: Slack username / handle.
        real_name:
          type: string
          nullable: true
        is_bot:
          type: boolean
          nullable: true

    Block:
      type: object
      description: Persisted Block Kit subset. Only `image` and `link` types are stored.
      properties:
        id:
          type: integer
        uid:
          type: string
          nullable: true
          description: Slack `block_id`.
        type:
          type: string
          enum: [image, link]
        image_url:
          type: string
          nullable: true
        alt_text:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        parent_id:
          type: integer
          nullable: true
        text:
          type: string
          nullable: true
        elements:
          nullable: true
          type: object
          additionalProperties: true
          description: JSON; unused for persisted image/link blocks.

    Attachment:
      type: object
      description: Link unfurl / Slack attachment.
      properties:
        id:
          type: integer
        from_url:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        ts:
          type: string
          nullable: true
          description: Parent message ts (varchar).
        channel:
          type: string
          nullable: true
        workspace:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
        pretext:
          type: string
          nullable: true
        block_ids:
          type: array
          nullable: true
          items:
            type: integer
        blocks:
          type: array
          description: Present when attachment is loaded as a primary row with joins; nested-in-message json_agg usually has `block_ids` only.
          items:
            $ref: '#/components/schemas/Block'

    File:
      type: object
      description: Slack file metadata. No API to fetch bytes.
      properties:
        id:
          type: integer
        uid:
          type: string
          description: Slack file id (unique).
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp string from the archive (`yyyy-MM-dd hh:mm:ss.SSS`).
        name:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        mimetype:
          type: string
          nullable: true
          description: Included on get; omitted on list.
        filetype:
          type: string
          nullable: true
        user:
          type: string
          nullable: true
          description: Slack user id of the uploader.
        real_name:
          type: string
          nullable: true
          description: Uploader display name (`slackuser.real_name`) on media list and `POST /file/get`.
        slack_name:
          type: string
          nullable: true
          description: Uploader Slack username (`slackuser.name`) on media list and `POST /file/get`.
        workspace:
          type: string
          nullable: true
        message:
          type: object
          nullable: true
          description: On `POST /file/get`, the earliest archived message that includes this file. Null when the file is not attached to a message.
          properties:
            ts:
              type: string
            channel:
              type: string
              nullable: true
        url:
          type: string
          nullable: true
          description: Slack `url_private`. Not a public URL.
        thumbnail:
          type: string
          nullable: true
          description: Slack `thumb_360` if present at ingest.
        savepath:
          type: string
          nullable: true
          description: |
            Local disk path under `FILES_DOWNLOAD_DIRECTORY`
            (`{workspace}/{channel}/{title}--{id}.{ext}`). Not fetchable via HTTP.

    FileListItem:
      allOf:
        - $ref: '#/components/schemas/File'
      description: Same as File but `mimetype` is not selected.

    Message:
      type: object
      description: Archive unit. Unique on Slack `ts`.
      properties:
        id:
          type: integer
        client_msg_id:
          type: string
          nullable: true
        reply_to:
          type: string
          nullable: true
          description: Parent message `ts` when this row is a thread reply; null/empty for channel-level messages.
        user:
          type: string
          nullable: true
          description: Slack user id (`U…`). Display name lives on `slackuser`.
        ts:
          type: string
          description: Slack timestamp, unique. Use this as the stable message key.
          example: '1704067200.123456'
        datetime:
          type: string
          nullable: true
          description: Derived from `ts` at ingest (`yyyy-MM-dd hh:mm:ss.SSS`).
        workspace:
          type: string
        channel:
          type: string
          description: Channel **name**.
        team:
          type: string
          nullable: true
          description: Slack team id. Omitted on list; present on get.
        type:
          type: string
          nullable: true
          description: Slack event type (usually `message`). Omitted on list; present on get.
        text:
          type: string
          nullable: true
          description: Message body. Only FTS field.
        file_ids:
          type: array
          nullable: true
          items:
            type: integer
        attachment_ids:
          type: array
          nullable: true
          items:
            type: integer
        block_ids:
          type: array
          nullable: true
          items:
            type: integer
        slackuser:
          type: array
          description: '`json_agg` of matching `slackuser` rows (usually 0–1). Not a single object.'
          items:
            $ref: '#/components/schemas/Slackuser'
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'

    MessageListItem:
      allOf:
        - $ref: '#/components/schemas/Message'
      description: List row. `team` and `type` are not selected. No `replies` array.

    MessageDetail:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          properties:
            replies:
              type: array
              items:
                $ref: '#/components/schemas/Message'
              description: Messages with `reply_to` equal to this message's `ts`, ordered by `ts`.

    MessageSearchHit:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          required: [rank]
          properties:
            rank:
              type: number
              format: float
              description: PostgreSQL `ts_rank_cd`. Higher is better.
      description: Flat message row (all columns) plus `rank`. No joined children.

    MessageListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedCollection'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MessageListItem'

    MessageThreadedListItem:
      allOf:
        - $ref: '#/components/schemas/MessageListItem'
        - type: object
          required: [replies]
          properties:
            replies:
              type: array
              items:
                $ref: '#/components/schemas/MessageListItem'
              description: |
                Child messages whose `reply_to` equals this item's `ts`, always
                ordered by `ts` ascending. `_orderby` does not apply here.

    MessageThreadedListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedCollection'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MessageThreadedListItem'
          description: Pagination counts top-level messages only.

    FileListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedCollection'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FileListItem'

    SlackuserListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Slackuser'

    AddEditResult:
      type: object
      properties:
        errors:
          type: array
          items: {}
        response:
          type: object
          additionalProperties: true
          description: Returning columns from the upsert (e.g. `{ id, ts }` for messages).

    SlackEventEnvelope:
      type: object
      description: Slack Events API body (fields vary by event).
      properties:
        token:
          type: string
          description: Compared to `SLACK_VERIFICATION_TOKEN_<WORKSPACE>`.
        challenge:
          type: string
          description: If present, echoed as the HTTP body (URL verification).
        type:
          type: string
        event:
          type: object
          properties:
            type:
              type: string
            subtype:
              type: string
              nullable: true
            user:
              description: User id string, or user object for `team_join`.
            ts:
              type: string
            text:
              type: string
            channel:
              type: string
              description: Slack channel ID; converted to name before save.
            team:
              type: string
            thread_ts:
              type: string
            message:
              type: object
              description: Present on `message_changed`.
            previous_message:
              type: object
            deleted_ts:
              type: string
          additionalProperties: true
      additionalProperties: true
